name: 网盘下载

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "操作模式(默认 search:粘文件名就下载)"
        required: false
        default: "search"
        type: choice
        options:
          - "search"
          - "list"
          - "download"
          - "selftest"
      netdisk:
        description: "网盘(与 storages.json 挂载名一致,未配置 Secret 的会被跳过)"
        required: false
        default: "baidu"
        type: choice
        options:
          - "baidu"
          - "quark"
          - "uc"
          - "aliyun"
          - "cloud189"
          - "xunlei"
          - "123pan"
          - "115"
          - "lanzou"
      keyword:
        description: "search 模式:文件名关键词(直接复制转存时的文件名,可只写一部分)"
        required: false
        default: ""
      subpath:
        description: "list/download 模式:子路径(挂载名之后的部分,以 / 开头)"
        required: false
        default: ""
      include:
        description: "download 模式下载文件夹时的文件名过滤(可选)"
        required: false
        default: ""
      depth:
        description: "list 模式的目录深度(1=只看当前层)"
        required: false
        default: "1"
      attempt:
        description: "自动续传轮数(内部用,不用填)"
        required: false
        default: "0"

permissions:
  contents: write
  actions: write

concurrency:
  group: netdisk
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OPENLIST_VERSION: v4.2.9
      OPENLIST_ADMIN_PASS: ${{ secrets.OPENLIST_ADMIN_PASS }}
      OPENLIST_ADMIN_PASSWORD: ${{ secrets.OPENLIST_ADMIN_PASS }}
      REPO_PAT: ${{ secrets.REPO_PAT }}
      QUARK_COOKIE: ${{ secrets.QUARK_COOKIE }}
      UC_COOKIE: ${{ secrets.UC_COOKIE }}
      ALIYUN_REFRESH_TOKEN: ${{ secrets.ALIYUN_REFRESH_TOKEN }}
      BAIDU_REFRESH_TOKEN: ${{ secrets.BAIDU_REFRESH_TOKEN }}
      CLOUD189_USER: ${{ secrets.CLOUD189_USER }}
      CLOUD189_PASS: ${{ secrets.CLOUD189_PASS }}
      XUNLEI_USER: ${{ secrets.XUNLEI_USER }}
      XUNLEI_PASS: ${{ secrets.XUNLEI_PASS }}
      PAN123_USER: ${{ secrets.PAN123_USER }}
      PAN123_PASS: ${{ secrets.PAN123_PASS }}
      PAN115_COOKIE: ${{ secrets.PAN115_COOKIE }}
      LANZOU_USER: ${{ secrets.LANZOU_USER }}
      LANZOU_PASS: ${{ secrets.LANZOU_PASS }}
      FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4

      - name: 拼接完整路径(挂载名 + 子路径,与 OpenList 一致)
        id: src
        run: |
          FULL="/${{ inputs.netdisk }}"
          SUB="${{ inputs.subpath }}"
          if [ -n "$SUB" ]; then
            case "$SUB" in /*) ;; *) SUB="/$SUB";; esac
            FULL="${FULL}${SUB}"
          fi
          FULL=$(printf '%s' "$FULL" | sed 's:/\+$::')
          if [ -z "$FULL" ]; then FULL="/${{ inputs.netdisk }}"; fi
          echo "full=$FULL" >> "$GITHUB_OUTPUT"

      - name: 安装 OpenList、rclone、aria2
        run: |
          curl -sL "https://github.com/OpenListTeam/OpenList/releases/download/${OPENLIST_VERSION}/openlist-linux-amd64.tar.gz" | tar xz -C /usr/local/bin
          curl -s https://rclone.org/install.sh | sudo bash
          (sudo apt-get install -y aria2 > /dev/null 2>&1 || true)
          command -v aria2c >/dev/null || echo "::warning::aria2 安装失败,将只有 rclone 回退通道"

      - name: 启动 OpenList 并挂载网盘(Secrets 中的 cookie)
        run: |
          mkdir -p run
          (cd run && nohup openlist server > openlist.log 2>&1 &)
          ok=0
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5244/ping > /dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            echo "::error::OpenList 启动失败"
            tail -30 run/openlist.log run/log/log.log 2>/dev/null
            exit 1
          fi
          python3 scripts/bootstrap_storages.py

      - name: 写入 rclone 配置
        run: |
          mkdir -p ~/.config/rclone
          {
            echo "[alist]"
            echo "type = webdav"
            echo "url = http://127.0.0.1:5244/dav"
            echo "vendor = other"
            echo "user = admin"
            echo "pass = $(rclone obscure "${OPENLIST_ADMIN_PASS}")"
          } > ~/.config/rclone/rclone.conf

      - name: search 模式:全盘搜索文件名
        id: target
        if: ${{ inputs.mode == 'search' || inputs.mode == 'download' }}
        env:
          SRC_PATH: ${{ steps.src.outputs.full }}
        run: |
          if [ "${{ inputs.mode }}" = "search" ]; then
            KW="${{ inputs.keyword }}"
            if [ -z "$KW" ]; then
              echo "::error::search 模式需要在 keyword 里填文件名(复制转存时看到的名字)"
              exit 1
            fi
            echo "全盘搜索:$KW ..."
            rclone lsf "alist:${SRC_PATH}/" --recursive --files-only --max-depth 6 --log-level ERROR > all.txt 2> ls.err || true
            grep -i -F -- "$KW" all.txt > matches.txt || true
            N=$(grep -c . matches.txt || true)
            if [ "$N" = "0" ]; then
              TEXT=$(printf '❌ 全盘没搜到 "%s"。\n确认:1) 已在网盘 App 里转存到自己账号;2) 关键字和文件名一致。%s' "$KW" "$(head -c 150 ls.err)")
              jq -n --arg t "$TEXT" '{msg_type:"text",content:{text:$t}}' \
                | curl -s -X POST "${FEISHU_WEBHOOK}" -H "Content-Type: application/json" -d @- > /dev/null
              exit 1
            fi
            MATCH=$(head -1 matches.txt)
            TARGET="/${{ inputs.netdisk }}/${MATCH}"
            echo "target=$TARGET" >> "$GITHUB_OUTPUT"
            echo "k=$(printf '%s' "$TARGET" | md5sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
            echo "matches=$N" >> "$GITHUB_OUTPUT"
            echo "目标已确定(匹配 $N 个,下载第 1 个)"
            TEXT=$(printf '🔎 搜索 "%s":匹配 %s 个,开始下载第 1 个:\n%s' "$KW" "$N" "$(head -5 matches.txt)")
            jq -n --arg t "$TEXT" '{msg_type:"text",content:{text:$t}}' \
              | curl -s -X POST "${FEISHU_WEBHOOK}" -H "Content-Type: application/json" -d @- > /dev/null
          else
            TARGET="$SRC_PATH"
            echo "target=$TARGET" >> "$GITHUB_OUTPUT"
            echo "k=$(printf '%s' "$TARGET" | md5sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          fi

      - name: 恢复上次下载进度
        if: ${{ inputs.mode == 'download' || inputs.mode == 'search' }}
        uses: actions/cache/restore@v4
        with:
          path: out
          key: netdisk-dl-${{ steps.target.outputs.k }}-${{ github.run_number }}
          restore-keys: |
            netdisk-dl-${{ steps.target.outputs.k }}-

      - name: 清理旧的下载 Release(保留最近 5 个)
        if: ${{ inputs.mode == 'download' || inputs.mode == 'search' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases" --paginate --jq '.[].tag_name' \
            | grep '^dl-' | tail -n +6 \
            | xargs -r -I{} gh release delete "{}" --yes --cleanup-tag

      - name: 查看目录(list 模式)
        if: ${{ inputs.mode == 'list' }}
        env:
          SRC_PATH: ${{ steps.src.outputs.full }}
        run: |
          rclone lsl "alist:${SRC_PATH}" --max-depth "${{ inputs.depth }}" > listing.txt 2> listing.err || true
          n=$(grep -c . listing.txt || true)
          if [ "$n" = "0" ]; then
            TEXT=$(printf '📂 %s:没列到内容(路径不对或为空)。错误:%s' "${SRC_PATH}" "$(head -c 200 listing.err)")
          else
            TEXT=$(printf '📂 %s 下共 %s 项(格式:大小 日期 文件名):\n%s' "${SRC_PATH}" "$n" "$(head -c 2500 listing.txt)")
          fi
          jq -n --arg t "$TEXT" '{msg_type:"text",content:{text:$t}}' \
            | curl -s -X POST "${FEISHU_WEBHOOK}" \
                -H "Content-Type: application/json" -d @- > /dev/null
          echo "== 目录清单 共${n}项(明细已发飞书,公开日志不显示文件名)=="

      - name: 自检(只读:列表→直链→分段拉取)
        if: ${{ inputs.mode == 'selftest' }}
        env:
          SRC_PATH: ${{ steps.src.outputs.full }}
        run: |
          PASS=1
          # 只读自检:百度官方应用 scope 无写权限(上传/建目录均 403),因此不写网盘,只验证读链路
          echo "[1/4] 列出 ${SRC_PATH}/ 并选择一个文件 ..."
          rclone lsf "alist:${SRC_PATH}/" --files-only --recursive --max-depth 3 --log-level ERROR > files.txt 2> files.err || true
          F=$(head -1 files.txt)
          if [ -z "$F" ]; then
            TEXT=$(printf '❌ 自检失败:%s 下(含子目录 3 层)没有可读文件。错误:%s' "${SRC_PATH}" "$(head -c 200 files.err)")
            jq -n --arg t "$TEXT" '{msg_type:"text",content:{text:$t}}' \
              | curl -s -X POST "${FEISHU_WEBHOOK}" -H "Content-Type: application/json" -d @- > /dev/null
            exit 1
          fi
          echo "已选中一个文件(名称见飞书,不进公开日志)"
          echo "[2/4] 取直链 ..."
          OL=$(curl -s -X POST http://127.0.0.1:5244/api/auth/login -H "Content-Type: application/json" -d "{\"username\":\"admin\",\"password\":\"$OPENLIST_ADMIN_PASS\"}" | jq -r .data.token)
          RAW=$(jq -n --arg p "${SRC_PATH%/}/${F}" '{path:$p}' \
            | curl -s -X POST http://127.0.0.1:5244/api/fs/get -H "Authorization: $OL" -H "Content-Type: application/json" -d @- \
            | jq -r '.data.raw_url // empty')
          if [ -z "$RAW" ]; then PASS=0; echo "未取得直链"; fi
          echo "[3/4] 分段拉取前 64KB 验证 ..."
          SZ=0
          if [ "$PASS" = 1 ]; then
            curl -s -L --max-time 120 -A "netdisk" -r 0-65535 -o chunk.bin "$RAW" || PASS=0
            SZ=$(stat -c %s chunk.bin 2>/dev/null || echo 0)
            [ "$SZ" -gt 0 ] || PASS=0
          fi
          echo "[4/4] 结论(只读自检,无需清理)..."
          if [ "$PASS" = 1 ]; then
            TEXT=$(printf '🧪 自检通过(只读):列表/直链/分段拉取 全部 OK(网盘=%s)\n样本: %s(%s 字节前段)' "${{ inputs.netdisk }}" "${SRC_PATH%/}/${F}" "$SZ")
          else
            TEXT=$(printf '❌ 自检失败(网盘=%s):列表/直链/分段拉取某环节未通过,查看日志' "${{ inputs.netdisk }}")
          fi
          jq -n --arg t "$TEXT" '{msg_type:"text",content:{text:$t}}' \
            | curl -s -X POST "${FEISHU_WEBHOOK}" -H "Content-Type: application/json" -d @- > /dev/null
          echo "自检结论: $([ "$PASS" = 1 ] && echo "PASS(取样 $SZ 字节)" || echo FAIL)"
          [ "$PASS" = 1 ] || exit 1

      - name: 从网盘下载文件(aria2 分段续传,失败回退 rclone)
        id: dl
        if: ${{ inputs.mode == 'download' || inputs.mode == 'search' }}
        env:
          SRC_PATH: ${{ steps.target.outputs.target }}
          ATTEMPT: ${{ inputs.attempt }}
        run: |
          mkdir -p out
          OL=$(curl -s -X POST http://127.0.0.1:5244/api/auth/login -H "Content-Type: application/json" -d "{\"username\":\"admin\",\"password\":\"$OPENLIST_ADMIN_PASS\"}" | jq -r .data.token)
          REQ=$(jq -n --arg p "$SRC_PATH" '{path:$p}')
          INFO=$(curl -s -X POST http://127.0.0.1:5244/api/fs/get -H "Authorization: $OL" -H "Content-Type: application/json" -d "$REQ")
          RAW_URL=$(echo "$INFO" | jq -r '.data.raw_url // empty')
          TOTAL=$(echo "$INFO" | jq -r '.data.size // 0')
          echo "直链: ${RAW_URL:0:60}... | 大小: $TOTAL"
          STATE=failed
          ISDIR=$(echo "$INFO" | jq -r '.data.is_dir // false')
          if [ "$ISDIR" = "true" ]; then
            echo "== 目标是文件夹,直接走 rclone =="
            args=(copy "alist:${SRC_PATH}" out/ --max-size 2G --transfers 4 --retries 2 --log-level NOTICE --stats-one-line --stats 60s)
            if [ -n "${{ inputs.include }}" ]; then args+=(--include "${{ inputs.include }}"); fi
            if rclone "${args[@]}"; then STATE=done; fi
          else
            if [ -n "$RAW_URL" ]; then
              UA=$(echo "$INFO" | jq -r '(.data.header | if type == "string" then (from_json | (.["User-Agent"] // .["user-agent"] // empty)) else (.["User-Agent"] // .["user-agent"] // empty) end) // empty' 2>/dev/null || true)
              A=(-c -x 16 -s 16 -k 4M --file-allocation=none --auto-file-renaming=false --allow-overwrite=true --summary-interval=60 -d out -o dl.bin)
              if [ -n "$UA" ]; then A+=(--header "User-Agent: $UA"); fi
              rc=0
              timeout -k 30 190m aria2c "${A[@]}" "$RAW_URL" || rc=$?
              if [ "$rc" = 0 ]; then
                mv out/dl.bin "out/$(basename "$SRC_PATH")" && STATE=done
              elif [ -f out/dl.bin ]; then
                STATE=partial
              fi
            fi
            if [ "$STATE" = "failed" ] && [ ! -f out/dl.bin ]; then
              echo "== aria2 未成功且无断点,回退 rclone =="
              args=(copy "alist:${SRC_PATH}" out/ --max-size 2G --transfers 4 --retries 2 --log-level NOTICE --stats-one-line --stats 60s)
              if [ -n "${{ inputs.include }}" ]; then args+=(--include "${{ inputs.include }}"); fi
              if rclone "${args[@]}"; then STATE=done; fi
            fi
          fi
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          if [ "$STATE" = "partial" ]; then
            CUR=$(stat -c %s out/dl.bin 2>/dev/null || echo 0)
            if [ "${TOTAL:-0}" -gt 0 ] 2>/dev/null; then PCT=$(( CUR * 100 / TOTAL )); else PCT=0; fi
            echo "pct=$PCT" >> "$GITHUB_OUTPUT"
            echo "cur=$CUR" >> "$GITHUB_OUTPUT"
            echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
            echo "⏳ 本轮结束:已下载 $CUR/$TOTAL 字节($PCT%),进度已保存"
            TEXT=$(printf '⏳ 分段下载进行中:已下载 %s%%(%s/%s 字节)\n进度已保存,即将自动排队下一轮继续(第 %s 轮)' "$PCT" "$CUR" "$TOTAL" "$(( ${ATTEMPT:-0} + 1 ))")
            jq -n --arg t "$TEXT" '{msg_type:"text",content:{text:$t}}' \
              | curl -s -X POST "${FEISHU_WEBHOOK}" \
                  -H "Content-Type: application/json" -d @- > /dev/null
          fi
          if [ "$STATE" = "failed" ]; then
            echo "::error::下载失败且无可用断点"
            exit 1
          fi

      - name: 保存下载进度
        if: ${{ always() && steps.dl.outputs.state == 'partial' }}
        uses: actions/cache/save@v4
        with:
          path: out
          key: netdisk-dl-${{ steps.target.outputs.k }}-${{ github.run_number }}

      - name: 自动排队下一轮续传
        if: ${{ always() && steps.dl.outputs.state == 'partial' }}
        env:
          ATTEMPT: ${{ inputs.attempt }}
        run: |
          NEXT=$(( ${ATTEMPT:-0} + 1 ))
          if [ "$NEXT" -gt 10 ]; then
            TEXT="❌ 自动续传已达 10 轮上限仍未完成,请人工检查"
            jq -n --arg t "$TEXT" '{msg_type:"text",content:{text:$t}}' \
              | curl -s -X POST "${FEISHU_WEBHOOK}" -H "Content-Type: application/json" -d @- > /dev/null
            exit 0
          fi
          PAYLOAD=$(jq -n --arg ref "${{ github.ref_name }}" \
            --arg mode "${{ inputs.mode }}" --arg netdisk "${{ inputs.netdisk }}" \
            --arg kw "${{ inputs.keyword }}" --arg sub "${{ inputs.subpath }}" --arg attempt "$NEXT" \
            '{ref:$ref, inputs:{mode:$mode, netdisk:$netdisk, keyword:$kw, subpath:$sub, attempt:$attempt}}')
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token $REPO_PAT" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/download.yml/dispatches" \
            -d "$PAYLOAD")
          echo "排队下一轮: HTTP $code (attempt=$NEXT)"

      - name: 上传到 Release
        if: ${{ steps.dl.outputs.state == 'done' }}
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub 资产名不支持非 ASCII(会被改成 default.zip):含非 ASCII 的文件改用安全名,原名写进说明
          NAMES=""
          for f in out/*; do
            base=$(basename "$f")
            if printf '%s' "$base" | LC_ALL=C grep -q '[^ -~]'; then
              ext="${base##*.}"; case "$ext" in "$base") ext="";; esac
              safe="dl-$(printf '%s' "$base" | md5sum | cut -c1-8)${ext:+.$ext}"
              mv "$f" "out/$safe"
              NAMES="$NAMES
              - ${base} → ${safe}"
            fi
          done
          TAG="dl-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" out/* \
            --title "网盘下载 $TAG" \
            --notes "来源路径: \`${{ steps.target.outputs.target }}\`$NAMES" --latest
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 清理已完成的进度缓存
        if: ${{ steps.dl.outputs.state == 'done' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/${{ github.repository }}/actions/caches?key=netdisk-dl-${{ steps.target.outputs.k }}-" --jq '.actions_caches[].id' 2>/dev/null); do
            gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$id" || true
          done

      - name: 飞书通知
        if: ${{ always() && (inputs.mode == 'download' || inputs.mode == 'search') && steps.dl.outputs.state != 'partial' }}
        env:
          STATUS: ${{ job.status }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.release.outputs.tag }}
          JOB_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SRC_PATH: ${{ steps.target.outputs.target }}
        run: |
          if [ "$STATUS" = "success" ]; then
            TEXT=$(printf '✅ 网盘下载完成\n来源路径: %s\n%s\n文件下载: %s' "$SRC_PATH" "$(ls -lh out/ | tail -n +2)" "$RELEASE_URL")
          else
            TEXT=$(printf '❌ 网盘下载失败\n来源路径: %s\n查看日志: %s' "$SRC_PATH" "$JOB_URL")
          fi
          jq -n --arg t "$TEXT" '{msg_type:"text",content:{text:$t}}' \
            | curl -s -X POST "${FEISHU_WEBHOOK}" \
                -H "Content-Type: application/json" -d @-

      - name: 回写轮换令牌(兜底)
        if: always()
        run: python3 scripts/bootstrap_storages.py --sync-only
