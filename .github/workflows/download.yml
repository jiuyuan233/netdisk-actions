name: 网盘下载

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "操作模式(list=看目录里有什么;download=下载)"
        required: false
        default: "download"
        type: choice
        options:
          - download
          - list
      path:
        description: "OpenList 路径,如 /baidu/宋浩精选【高数、线代、概率论】.zip"
        required: true
        type: string
      include:
        description: "文件名过滤(可选,通配符,如 *.mkv;留空=全部)"
        required: false
        default: ""
      depth:
        description: "list 模式的目录深度(1=只看当前层)"
        required: false
        default: "1"
      probe:
        description: "附加诊断/测速(一般不勾)"
        required: false
        default: "false"
        type: boolean
      attempt:
        description: "自动续传轮数(内部用,不用填)"
        required: false
        default: "0"

permissions:
  contents: write
  actions: write

concurrency:
  group: netdisk
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OPENLIST_VERSION: v4.2.9
      OPENLIST_ADMIN_PASS: ${{ secrets.OPENLIST_ADMIN_PASS }}
      OPENLIST_ADMIN_PASSWORD: ${{ secrets.OPENLIST_ADMIN_PASS }}
      REPO_PAT: ${{ secrets.REPO_PAT }}
      QUARK_COOKIE: ${{ secrets.QUARK_COOKIE }}
      UC_COOKIE: ${{ secrets.UC_COOKIE }}
      ALIYUN_REFRESH_TOKEN: ${{ secrets.ALIYUN_REFRESH_TOKEN }}
      BAIDU_REFRESH_TOKEN: ${{ secrets.BAIDU_REFRESH_TOKEN }}
      CLOUD189_COOKIE: ${{ secrets.CLOUD189_COOKIE }}
      XUNLEI_COOKIE: ${{ secrets.XUNLEI_COOKIE }}
      PAN123_TOKEN: ${{ secrets.PAN123_TOKEN }}
      PAN115_COOKIE: ${{ secrets.PAN115_COOKIE }}
      LANZOU_USER: ${{ secrets.LANZOU_USER }}
      LANZOU_PASS: ${{ secrets.LANZOU_PASS }}
      FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 OpenList、rclone、aria2
        run: |
          curl -sL "https://github.com/OpenListTeam/OpenList/releases/download/${OPENLIST_VERSION}/openlist-linux-amd64.tar.gz" | tar xz -C /usr/local/bin
          curl -s https://rclone.org/install.sh | sudo bash
          (sudo apt-get install -y aria2 > /dev/null 2>&1 || true)
          command -v aria2c >/dev/null || echo "::warning::aria2 安装失败,将只有 rclone 回退通道"

      - name: 启动 OpenList 并挂载网盘(Secrets 中的 cookie)
        run: |
          mkdir -p run
          (cd run && nohup openlist server > openlist.log 2>&1 &)
          ok=0
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5244/ping > /dev/null; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            echo "::error::OpenList 启动失败"
            tail -30 run/openlist.log run/log/log.log 2>/dev/null
            exit 1
          fi
          python3 scripts/bootstrap_storages.py

      - name: 写入 rclone 配置
        run: |
          mkdir -p ~/.config/rclone
          {
            echo "[alist]"
            echo "type = webdav"
            echo "url = http://127.0.0.1:5244/dav"
            echo "vendor = other"
            echo "user = admin"
            echo "pass = $(rclone obscure "${OPENLIST_ADMIN_PASS}")"
          } > ~/.config/rclone/rclone.conf

      - name: 计算断点任务键
        id: dlkey
        run: echo "k=$(printf '%s' "${{ inputs.path }}" | md5sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: 恢复上次下载进度
        if: ${{ inputs.mode == 'download' }}
        uses: actions/cache/restore@v4
        with:
          path: out
          key: netdisk-dl-${{ steps.dlkey.outputs.k }}-${{ github.run_number }}
          restore-keys: |
            netdisk-dl-${{ steps.dlkey.outputs.k }}-

      - name: 清理旧的下载 Release(保留最近 5 个)
        if: ${{ inputs.mode == 'download' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/releases" --paginate --jq '.[].tag_name' \
            | grep '^dl-' | tail -n +6 \
            | xargs -r -I{} gh release delete "{}" --yes --cleanup-tag

      - name: 查看目录(list 模式)
        if: ${{ inputs.mode == 'list' }}
        env:
          SRC_PATH: ${{ inputs.path }}
        run: |
          rclone lsl "alist:${{ inputs.path }}" --max-depth "${{ inputs.depth }}" > listing.txt 2> listing.err || true
          n=$(grep -c . listing.txt || true)
          if [ "$n" = "0" ]; then
            TEXT=$(printf '📂 %s:没列到内容(路径不对或为空)。错误:%s' "${SRC_PATH}" "$(head -c 200 listing.err)")
          else
            TEXT=$(printf '📂 %s 下共 %s 项(格式:大小 日期 文件名):\n%s' "${SRC_PATH}" "$n" "$(head -c 2500 listing.txt)")
          fi
          jq -n --arg t "$TEXT" '{msg_type:"text",content:{text:$t}}' \
            | curl -s -X POST "${FEISHU_WEBHOOK}" \
                -H "Content-Type: application/json" -d @-
          echo "== 目录清单 共${n}项 =="
          cat listing.txt || true
          head -c 300 listing.err || true
          if [ "${{ inputs.probe }}" = "true" ]; then
            OL=$(curl -s -X POST http://127.0.0.1:5244/api/auth/login -H "Content-Type: application/json" -d "{\"username\":\"admin\",\"password\":\"$OPENLIST_ADMIN_PASS\"}" | jq -r .data.token)
            ADD=$(curl -s "http://127.0.0.1:5244/api/admin/storage/list" -H "Authorization: $OL" | jq -r '.data.content[] | select(.mount_path=="/baidu") | .addition')
            AT=$(echo "$ADD" | jq -r '.AccessToken // empty')
            echo "== 百度原始API诊断(AT=${AT:0:16}...) =="
            for D in "%2F" "%2Fapps"; do
              echo "--- dir=$D ---"
              curl -s "https://pan.baidu.com/rest/2.0/xpan/file?method=list&access_token=${AT}&dir=${D}&web=1&limit=100" | head -c 1500
              echo ""
            done
          fi

      - name: 从网盘下载文件(aria2 分段续传,失败回退 rclone)
        id: dl
        if: ${{ inputs.mode == 'download' }}
        env:
          SRC_PATH: ${{ inputs.path }}
          ATTEMPT: ${{ inputs.attempt }}
        run: |
          mkdir -p out
          OL=$(curl -s -X POST http://127.0.0.1:5244/api/auth/login -H "Content-Type: application/json" -d "{\"username\":\"admin\",\"password\":\"$OPENLIST_ADMIN_PASS\"}" | jq -r .data.token)
          INFO=$(curl -s -X POST http://127.0.0.1:5244/api/fs/get -H "Authorization: $OL" -H "Content-Type: application/json" -d "{\"path\":\"${SRC_PATH}\"}")
          RAW_URL=$(echo "$INFO" | jq -r '.data.raw_url // empty')
          TOTAL=$(echo "$INFO" | jq -r '.data.size // 0')
          echo "直链: ${RAW_URL:0:60}... | 大小: $TOTAL"
          STATE=failed
          if [ -n "$RAW_URL" ]; then
            UA=$(echo "$INFO" | jq -r '(.data.header | if type == "string" then (from_json | (.["User-Agent"] // .["user-agent"] // empty)) else (.["User-Agent"] // .["user-agent"] // empty) end) // empty' 2>/dev/null || true)
            A=(-c -x 16 -s 16 -k 4M --file-allocation=none --auto-file-renaming=false --allow-overwrite=true --summary-interval=60 -d out -o dl.bin)
            if [ -n "$UA" ]; then A+=(--header "User-Agent: $UA"); fi
            rc=0
            timeout -k 30 190m aria2c "${A[@]}" "$RAW_URL" || rc=$?
            if [ "$rc" = 0 ]; then
              mv out/dl.bin "out/$(basename "$SRC_PATH")" && STATE=done
            elif [ -f out/dl.bin ]; then
              STATE=partial
            fi
          fi
          if [ "$STATE" = "failed" ] && [ ! -f out/dl.bin ]; then
            echo "== aria2 未成功且无断点,回退 rclone =="
            args=(copy "alist:${SRC_PATH}" out/ --max-size 2G --transfers 4 --retries 2 --log-level NOTICE --stats-one-line --stats 60s)
            if [ -n "${{ inputs.include }}" ]; then args+=(--include "${{ inputs.include }}"); fi
            if rclone "${args[@]}"; then STATE=done; fi
          fi
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          if [ "$STATE" = "partial" ]; then
            CUR=$(stat -c %s out/dl.bin 2>/dev/null || echo 0)
            if [ "${TOTAL:-0}" -gt 0 ] 2>/dev/null; then PCT=$(( CUR * 100 / TOTAL )); else PCT=0; fi
            echo "pct=$PCT" >> "$GITHUB_OUTPUT"
            echo "cur=$CUR" >> "$GITHUB_OUTPUT"
            echo "total=$TOTAL" >> "$GITHUB_OUTPUT"
            echo "⏳ 本轮结束:已下载 $CUR/$TOTAL 字节($PCT%),进度已保存"
            TEXT=$(printf '⏳ 分段下载进行中:已下载 %s%%(%s/%s 字节)\n进度已保存,即将自动排队下一轮继续(第 %s 轮)' "$PCT" "$CUR" "$TOTAL" "$(( ${ATTEMPT:-0} + 1 ))")
            jq -n --arg t "$TEXT" '{msg_type:"text",content:{text:$t}}' \
              | curl -s -X POST "${FEISHU_WEBHOOK}" \
                  -H "Content-Type: application/json" -d @- > /dev/null
          fi
          if [ "$STATE" = "failed" ]; then
            echo "::error::下载失败且无可用断点"
            exit 1
          fi

      - name: 保存下载进度
        if: ${{ always() && steps.dl.outputs.state == 'partial' }}
        uses: actions/cache/save@v4
        with:
          path: out
          key: netdisk-dl-${{ steps.dlkey.outputs.k }}-${{ github.run_number }}

      - name: 自动排队下一轮续传
        if: ${{ always() && steps.dl.outputs.state == 'partial' }}
        env:
          ATTEMPT: ${{ inputs.attempt }}
          SRC_PATH: ${{ inputs.path }}
        run: |
          NEXT=$(( ${ATTEMPT:-0} + 1 ))
          if [ "$NEXT" -gt 10 ]; then
            TEXT=$(printf '❌ 自动续传已达 10 轮上限仍未完成,请人工检查(%s)' "$SRC_PATH")
            jq -n --arg t "$TEXT" '{msg_type:"text",content:{text:$t}}' \
              | curl -s -X POST "${FEISHU_WEBHOOK}" -H "Content-Type: application/json" -d @- > /dev/null
            exit 0
          fi
          PAYLOAD=$(jq -n --arg ref "${{ github.ref_name }}" --arg path "$SRC_PATH" --arg attempt "$NEXT" \
            '{ref:$ref, inputs:{mode:"download", path:$path, attempt:$attempt}}')
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token $REPO_PAT" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/download.yml/dispatches" \
            -d "$PAYLOAD")
          echo "排队下一轮: HTTP $code (attempt=$NEXT)"

      - name: 上传到 Release
        if: ${{ steps.dl.outputs.state == 'done' }}
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="dl-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" out/* \
            --title "网盘下载 $TAG" \
            --notes "来源路径: \`${{ inputs.path }}\`" --latest
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: 清理已完成的进度缓存
        if: ${{ steps.dl.outputs.state == 'done' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/${{ github.repository }}/actions/caches?key=netdisk-dl-${{ steps.dlkey.outputs.k }}-" --jq '.actions_caches[].id' 2>/dev/null); do
            gh api -X DELETE "repos/${{ github.repository }}/actions/caches/$id" || true
          done

      - name: 飞书通知
        if: ${{ always() && inputs.mode == 'download' && steps.dl.outputs.state != 'partial' }}
        env:
          STATUS: ${{ job.status }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.release.outputs.tag }}
          JOB_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SRC_PATH: ${{ inputs.path }}
        run: |
          if [ "$STATUS" = "success" ]; then
            TEXT=$(printf '✅ 网盘下载完成\n来源路径: %s\n%s\n文件下载: %s' "$SRC_PATH" "$(ls -lh out/ | tail -n +2)" "$RELEASE_URL")
          else
            TEXT=$(printf '❌ 网盘下载失败\n来源路径: %s\n查看日志: %s' "$SRC_PATH" "$JOB_URL")
          fi
          jq -n --arg t "$TEXT" '{msg_type:"text",content:{text:$t}}' \
            | curl -s -X POST "${FEISHU_WEBHOOK}" \
                -H "Content-Type: application/json" -d @-

      - name: 回写轮换令牌(兜底)
        if: always()
        run: python3 scripts/bootstrap_storages.py --sync-only
